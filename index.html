
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffdce8">
<title>Ako Paba, Boss? 🎀</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Patrick+Hand&display=swap');

:root {
    --pink: #ffb6cc;
    --light-pink: #fff0f5;
    --hot-pink: #ff719d;
    --dark-pink: #df4779;
    --green: #79d9a6;
    --ink: #795061;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    background:
        radial-gradient(ellipse at 15% 20%, #fff7fa 0 2%, transparent 35%),
        radial-gradient(ellipse at 85% 80%, #ffe9f1 0 3%, transparent 35%),
        linear-gradient(140deg, #ffd9e7, #ffc6da, #ffe6ee);
}

/* Floating background decorations */

.decor {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    user-select: none;
    animation: floatDecor var(--duration, 5s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    opacity: .65;
}

@keyframes floatDecor {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
}

.sparkle {
    position: fixed;
    color: white;
    font-size: 24px;
    pointer-events: none;
    animation: twinkle 2s ease-in-out infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(.75); }
    50% { opacity: 1; transform: scale(1.2); }
}

/* Main card */

.card {
    width: min(100%, 370px);
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 27px 20px 23px;
    border: 2px solid rgba(255,255,255,.95);
    border-radius: 32px;
    background: rgba(255, 250, 252, .94);
    box-shadow:
        0 20px 55px rgba(194, 91, 130, .15),
        inset 0 0 0 5px rgba(255,255,255,.4);
    animation: cardIn .7s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(.94); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.ribbon {
    display: inline-block;
    color: #d75b87;
    background: #ffe0eb;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

h1 {
    font-family: 'Patrick Hand', cursive;
    color: #bb527a;
    font-size: clamp(34px, 9vw, 42px);
    font-weight: normal;
    line-height: 1.1;
    margin: 0 0 8px;
}

.subtitle {
    color: #b38b9a;
    font-size: 14px;
    margin: 0;
}

/* Original hand-drawn character */

.character-stage {
    position: relative;
    width: 190px;
    height: 190px;
    margin: 3px auto 4px;
}

.character {
    position: absolute;
    inset: 0;
    transform-origin: 50% 85%;
    animation: bodyDance .65s ease-in-out infinite;
}

.character svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

@keyframes bodyDance {
    0%, 100% { transform: rotate(-5deg) translateY(0); }
    25% { transform: rotate(5deg) translateY(-8px); }
    50% { transform: rotate(-5deg) translateY(0) scale(.98); }
    75% { transform: rotate(5deg) translateY(-8px); }
}

.arm-left {
    transform-box: fill-box;
    transform-origin: 80% 20%;
    animation: armLeft .5s ease-in-out infinite alternate;
}

.arm-right {
    transform-box: fill-box;
    transform-origin: 20% 20%;
    animation: armRight .5s ease-in-out infinite alternate;
}

@keyframes armLeft {
    from { transform: rotate(-20deg); }
    to { transform: rotate(25deg); }
}

@keyframes armRight {
    from { transform: rotate(20deg); }
    to { transform: rotate(-25deg); }
}

.leg-left {
    transform-box: fill-box;
    transform-origin: top center;
    animation: legLeft .5s ease-in-out infinite alternate;
}

.leg-right {
    transform-box: fill-box;
    transform-origin: top center;
    animation: legRight .5s ease-in-out infinite alternate;
}

@keyframes legLeft {
    from { transform: rotate(-12deg); }
    to { transform: rotate(15deg); }
}

@keyframes legRight {
    from { transform: rotate(12deg); }
    to { transform: rotate(-15deg); }
}

.cheek {
    animation: blush 1.2s ease-in-out infinite alternate;
}

@keyframes blush {
    from { opacity: .55; }
    to { opacity: 1; }
}

.floating-heart {
    position: absolute;
    color: #ff83aa;
    font-size: 23px;
    animation: heartBob 1.8s ease-in-out infinite;
}

.heart-one { top: 25px; left: 8px; }
.heart-two { top: 44px; right: 5px; animation-delay: -.8s; }
.heart-three { bottom: 20px; right: 20px; animation-delay: -.4s; }

@keyframes heartBob {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.12); }
}

/* Buttons */

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 58px;
    margin-top: 14px;
}

button {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    transition: transform .22s, box-shadow .22s, background .22s;
}

#yes {
    position: relative;
    z-index: 1;
    min-height: 48px;
    padding: 13px 25px;
    border-radius: 30px;
    background: linear-gradient(135deg, #8be7b0, #57c98b);
    color: #fff;
    font-size: 15px;
    box-shadow: 0 5px 0 #40ae74, 0 8px 16px #70d9a344;
    transform-origin: center;
}

#yes:hover {
    background: linear-gradient(135deg, #a0edbd, #57c98b);
    box-shadow: 0 6px 0 #40ae74, 0 10px 20px #70d9a355;
}

#yes:active {
    box-shadow: 0 2px 0 #40ae74;
}

#no {
    position: relative;
    z-index: 5;
    min-height: 44px;
    padding: 12px 21px;
    border-radius: 30px;
    background: linear-gradient(135deg, #ff9bb8, #f777a0);
    color: white;
    font-size: 13px;
    box-shadow: 0 4px 0 #df648b;
}

#no:active {
    transform: scale(.95);
}

.hint {
    color: #c28da2;
    font-size: 12px;
    margin-top: 19px;
}

.bottom-hearts {
    color: #ff9bb8;
    letter-spacing: 5px;
    margin-top: 8px;
    font-size: 14px;
}

/* Happy ending */

#ending {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 22px;
    padding-bottom: max(22px, env(safe-area-inset-bottom));
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    background:
        radial-gradient(circle at 50% 40%, #fff7fa, transparent 55%),
        linear-gradient(145deg, #ffd9e7, #ffc1d7);
}

#ending .character-stage {
    width: 190px;
    height: 190px;
    flex-shrink: 0;
}

#ending h2 {
    color: #d75083;
    font-family: 'Patrick Hand', cursive;
    font-size: clamp(37px, 9vw, 52px);
    font-weight: normal;
    line-height: 1.08;
    margin: 14px 0 8px;
    animation: endingPop .6s ease-out;
}

#ending p {
    color: #b17b91;
    font-size: 15px;
    line-height: 1.6;
    margin: 4px 0;
}

#replay {
    background: linear-gradient(135deg, #ff8fb2, #ed6896);
    color: white;
    border-radius: 30px;
    padding: 14px 25px;
    margin-top: 24px;
    box-shadow: 0 5px 0 #d95784;
    font-size: 14px;
}

@keyframes endingPop {
    from { transform: scale(.5) rotate(-6deg); opacity: 0; }
    75% { transform: scale(1.08) rotate(2deg); opacity: 1; }
    to { transform: scale(1) rotate(0); }
}

.celebration {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    animation: celebrate 2.8s ease-out forwards;
}

@keyframes celebrate {
    0% { transform: translateY(0) rotate(0) scale(.6); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-75vh) rotate(240deg) scale(1.3); opacity: 0; }
}

/* Mobile layout */

@media (max-width: 420px) {
    body { padding: 13px; }

    .card {
        padding: 22px 15px 19px;
        border-radius: 28px;
    }

    .character-stage {
        width: 170px;
        height: 170px;
    }

    h1 { font-size: 36px; }

    .buttons { gap: 10px; }
}

@media (max-height: 700px) {
    .card { padding-top: 15px; padding-bottom: 14px; }
    .ribbon { margin-bottom: 6px; }
    h1 { margin-bottom: 4px; }
    .character-stage { width: 135px; height: 135px; }
    .hint { margin-top: 11px; }
    .bottom-hearts { margin-top: 3px; }
    #ending .character-stage { width: 145px; height: 145px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 2s !important;
        animation-iteration-count: infinite !important;
    }
}
</style>
</head>

<script>
const card = document.getElementById("card");
const question = document.getElementById("question");
const subtitle = document.getElementById("subtitle");
const hint = document.getElementById("hint");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const ending = document.getElementById("ending");

let attempts = 0;
let yesScale = 1;
let lastDodge = 0;

const noTexts = [
    "NOPE!",
    "SURE KA? ♡",
    "AYAW BOSS!",
    "THINK AGAIN!",
    "BOSS NAMAN 😭",
    "LAST CHANCE!",
    "CLICK YES NA!"
];

// Add floating decorations
function createDecorations() {
    const symbols = ["♡", "♥", "✧", "✿", "·"];

    for (let i = 0; i < 17; i++) {
        const el = document.createElement("span");
        el.className = "decor";
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = Math.random() * 100 + "vh";
        el.style.fontSize = (12 + Math.random() * 19) + "px";
        el.style.setProperty("--duration", (3 + Math.random() * 5) + "s");
        el.style.setProperty("--delay", (-Math.random() * 5) + "s");
        document.body.appendChild(el);
    }
}

createDecorations();

function dodgeButton() {
    const now = Date.now();
    if (now - lastDodge < 300) return;
    lastDodge = now;

    attempts++;

    // YES grows as NO escapes
    yesScale = Math.min(yesScale + .13, 2.0);
    yes.style.transform = `scale(${yesScale})`;

    no.textContent = noTexts[
        Math.min(attempts, noTexts.length - 1)
    ];

    no.style.position = "fixed";

    const margin = 12;
    const maxX = Math.max(margin, window.innerWidth - no.offsetWidth - margin);
    const maxY = Math.max(margin, window.innerHeight - no.offsetHeight - margin);

    no.style.left = (margin + Math.random() * (maxX - margin)) + "px";
    no.style.top = (margin + Math.random() * (maxY - margin)) + "px";

    if (attempts >= 3) {
        question.textContent = "AKO PABA, BOSS?";
        subtitle.textContent = "Please naman ohhh! ♡";
        hint.textContent = "My tiny heart can't take this! ♡";
    }

    if (attempts >= 6) {
        hint.textContent = "One little YES would make my day! ♡";
    }

    // Tiny heart particles
    if (attempts % 2 === 0) {
        const heart = document.createElement("span");
        heart.className = "celebration";
        heart.textContent = "♡";
        heart.style.left = Math.random() * 90 + "vw";
        heart.style.top = Math.random() * 75 + "vh";
        heart.style.color = "#f36f9b";
        heart.style.fontSize = "25px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2800);
    }
}

no.addEventListener("pointerenter", event => {
    if (event.pointerType === "mouse") dodgeButton();
});

no.addEventListener("click", dodgeButton);

function celebrate() {
    const symbols = ["♥", "♡", "✿", "✧", "❤"];

    for (let i = 0; i < 45; i++) {
        setTimeout(() => {
            const el = document.createElement("span");
            el.className = "celebration";
            el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            el.style.left = Math.random() * 100 + "vw";
            el.style.top = (55 + Math.random() * 40) + "vh";
            el.style.color = ["#ff719d", "#e6a5bd", "#ffcc76", "#d88bf0"][
                Math.floor(Math.random() * 4)
            ];
            el.style.fontSize = (16 + Math.random() * 25) + "px";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2900);
        }, i * 45);
    }
}

yes.addEventListener("click", () => {
    card.style.display = "none";
    ending.style.display = "flex";
    celebrate();
});

document.getElementById("replay").addEventListener("click", () => {
    ending.style.display = "none";
    card.style.display = "flex";

    question.textContent = "Ako paba, boss?";
    subtitle.textContent = "Please say yes... pretty please? ♡";
    hint.textContent = "Made with a little bit of love ♡";

    attempts = 0;
    yesScale = 1;
    lastDodge = 0;

    yes.style.transform = "scale(1)";
    no.textContent = "NOPE!";
    no.style.position = "relative";
    no.style.left = "";
    no.style.top = "";
});
</script>

</body>
</html>
